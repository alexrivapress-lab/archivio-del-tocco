    /* =========================================================
   RICERCA VOCALE - VERSIONE ROBUSTA IOS / CHROME
========================================================= */

let voiceRecognition = null;
let voiceBusy = false;


/* =========================================================
   AVVIO RICERCA VOCALE
========================================================= */

function startVoiceSearch() {

  if (voiceBusy) {
    return;
  }


  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!Recognition) {

    setVoiceMessage(
      'Riconoscimento vocale non disponibile su questo browser.',
      true
    );

    return;
  }


  /*
    Creiamo SEMPRE una nuova istanza.
    Su iPhone/Chrome il riutilizzo della stessa
    istanza può bloccarsi dopo la prima ricerca.
  */

  voiceRecognition =
    new Recognition();


  voiceRecognition.lang =
    'it-IT';


  voiceRecognition.continuous =
    false;


  voiceRecognition.interimResults =
    false;


  voiceRecognition.maxAlternatives =
    1;


  voiceBusy =
    true;


  const button =
    document.getElementById(
      'voiceButton'
    );


  button.disabled =
    true;


  button.classList.add(
    'listening'
  );


  button.textContent =
    '🎤 PARLA...';


  setVoiceMessage(
    'Sto ascoltando...',
    false
  );


  /*
    Timeout di sicurezza:
    se iOS non chiude l'ascolto da solo,
    lo fermiamo comunque.
  */

  const safetyTimer =
    setTimeout(
      function() {

        try {

          if (
            voiceRecognition
          ) {

            voiceRecognition.stop();

          }

        } catch(error) {

          console.error(
            error
          );

        }

      },
      8000
    );


  voiceRecognition.onresult =
    function(event) {

      clearTimeout(
        safetyTimer
      );


      const text =
        String(
          event &&
          event.results &&
          event.results[0] &&
          event.results[0][0]
            ? event.results[0][0].transcript
            : ''
        )
        .trim();


      /*
        Fermiamo subito il riconoscimento.
      */

      try {

        voiceRecognition.stop();

      } catch(error) {

        console.error(
          error
        );

      }


      if (!text) {

        setVoiceMessage(
          'Non ho capito. Riprova.',
          true
        );

        return;

      }


      setVoiceMessage(
        'Ho capito: “' +
        text +
        '”',
        false
      );


      executeVoiceCommand(
        text
      );

    };


  voiceRecognition.onerror =
    function(event) {

      clearTimeout(
        safetyTimer
      );


      const errorCode =
        event &&
        event.error
          ? event.error
          : 'errore-sconosciuto';


      /*
        "aborted" spesso arriva dopo stop().
        Non lo trattiamo come errore grave.
      */

      if (
        errorCode ===
        'aborted'
      ) {

        return;

      }


      let message =
        'Errore voce: ' +
        errorCode;


      if (
        errorCode ===
        'no-speech'
      ) {

        message =
          'Non ho sentito nulla. Riprova.';

      }


      if (
        errorCode ===
        'network'
      ) {

        message =
          'Errore del servizio vocale. Riprova.';

      }


      if (
        errorCode ===
        'not-allowed'
      ) {

        message =
          'Accesso al microfono non consentito.';

      }


      setVoiceMessage(
        message,
        true
      );

    };


  voiceRecognition.onend =
    function() {

      clearTimeout(
        safetyTimer
      );


      /*
        Reset completo.
      */

      voiceBusy =
        false;


      button.disabled =
        false;


      button.classList.remove(
        'listening'
      );


      button.textContent =
        '🎤 RICERCA RAPIDA';


      /*
        Eliminiamo l'istanza.
        La prossima ricerca ne creerà una nuova.
      */

      voiceRecognition =
        null;

    };


  try {

    voiceRecognition.start();

  }

  catch(error) {

    clearTimeout(
      safetyTimer
    );


    voiceBusy =
      false;


    button.disabled =
      false;


    button.classList.remove(
      'listening'
    );


    button.textContent =
      '🎤 RICERCA RAPIDA';


    voiceRecognition =
      null;


    setVoiceMessage(
      'Impossibile avviare il microfono. Riprova.',
      true
    );

  }

}


/* =========================================================
   INTERPRETA COMANDO VOCALE
========================================================= */

function executeVoiceCommand(text) {

  let value =
    String(
      text || ''
    )
    .trim();


  /*
    Prima proviamo a togliere le frasi introduttive.
  */

  value =
    value
      .replace(
        /^fammi vedere\s+/i,
        ''
      )
      .replace(
        /^mostrami\s+/i,
        ''
      )
      .replace(
        /^mostra\s+/i,
        ''
      )
      .replace(
        /^cercami\s+/i,
        ''
      )
      .replace(
        /^cerca\s+/i,
        ''
      )
      .replace(
        /^trova\s+/i,
        ''
      )
      .replace(
        /^trovami\s+/i,
        ''
      )
      .replace(
        /^voglio vedere\s+/i,
        ''
      )
      .replace(
        /^fammi vedere tutti\s+/i,
        ''
      )
      .replace(
        /^fammi vedere tutte\s+/i,
        ''
      )
      .replace(
        /^(i|gli|le)\s+/i,
        ''
      )
      .replace(
        /^(dischi|album|vinili|cd|cassette)\s+/i,
        ''
      )
      .replace(
        /^(di|dei|degli|delle|del|della)\s+/i,
        ''
      )
      .replace(
        /[?.!,;:]+$/g,
        ''
      )
      .replace(
        /\s+/g,
        ' '
      )
      .trim();


  /*
    Se la pulizia svuota tutto,
    usiamo la frase originale.
  */

  if (!value) {

    value =
      String(
        text || ''
      ).trim();

  }


  document
    .getElementById(
      'searchInput'
    )
    .value =
    value;


  runSearch();

}


/* =========================================================
   MESSAGGIO VOCALE
========================================================= */

function setVoiceMessage(
  text,
  error
) {

  const element =
    document.getElementById(
      'voiceMessage'
    );


  if (!element) {
    return;
  }


  element.textContent =
    text || '';


  element.classList.toggle(
    'error',
    !!error
  );

}

<body>


<main class="app">

  <h1 class="title">
    ARCHIVIO DEL TOCCO
  </h1>

  <div class="subtitle">
    Nuova PWA
  </div>


  <div
    id="status"
    class="status"
  >
    COLLEGAMENTO ALL'ARCHIVIO...
  </div>


  <div class="voice-wrap">

    <button
      id="voiceButton"
      class="voice-button"
      onclick="startVoiceSearch()"
    >
      🎤 RICERCA RAPIDA

    ></div>

      id="searchInput"

      oninput="runSearch()"

      class="search-button"
      onclick="clearSearch()"
    >
      AZZERA
    </button>

  </div>


  <section
    id="archive"
    class="archive"
  ></section>

<script>


/* =========================================================
   URL API APPS SCRIPT
========================================================= */

const API_URL =
  'https://script.google.com/macros/s/AKfycbw5ysUVlTVgq3sgynZA1MOtrlAZgHhOnk0BiAKoWLEA2Rj5OleFZAy07NB4i7zg9WW_/exec';


let archiveItems = [];

let voiceRecognition = null;



/* =========================================================
   AVVIO
========================================================= */

document.addEventListener(
  'DOMContentLoaded',
  function() {

    setupVoiceSearch();

    loadArchive();

  }
);


/* =========================================================
   JSONP
========================================================= */

function jsonpRequest(
  action,
  params
) {

  return new Promise(
    function(resolve,reject) {

      const callbackName =
        '__jsonp_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random() *
          100000
        );


      const script =
        document.createElement(
          'script'
        );


      const query =
        new URLSearchParams();


      query.set(
        'api',
        '1'
      );


      query.set(
        'action',
        action
      );


      query.set(
        'callback',
        callbackName
      );


      if (params) {

        Object.keys(
          params
        )
        .forEach(
          function(key) {

            query.set(
              key,
              params[key]
            );

          }
        );

      }


      let timeout =
        setTimeout(
          function() {

            cleanup();

            reject(
              new Error(
                'Timeout collegamento API.'
              )
            );

          },
          20000
        );


      function cleanup() {

        clearTimeout(
          timeout
        );


        if (
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );

        }


        try {

          delete window[
            callbackName
          ];

        } catch(error) {

          window[
            callbackName
          ] = undefined;

        }

      }


      window[
        callbackName
      ] =
        function(data) {

          cleanup();

          resolve(
            data
          );

        };


      script.onerror =
        function() {

          cleanup();

          reject(
            new Error(
              'Errore di collegamento con Apps Script.'
            )
          );

        };


      script.src =
        API_URL +
        '?' +
        query.toString();


      document.body.appendChild(
        script
      );

    }
  );

}


/* =========================================================
   CARICA ARCHIVIO
========================================================= */

async function loadArchive() {

  const status =
    document.getElementById(
      'status'
    );


  status.textContent =
    'COLLEGAMENTO ALL\'ARCHIVIO...';


  try {

    const response =
      await jsonpRequest(
        'archive'
      );


    if (
      !response ||
      !response.success
    ) {

      throw new Error(
        response &&
        response.error
          ? response.error
          : 'Risposta API non valida.'
      );

    }


    archiveItems =
      sortItems(
        response.items || []
      );


    status.textContent =
      archiveItems.length +
      (
        archiveItems.length === 1
          ? ' DISCO PRESENTE'
          : ' DISCHI PRESENTI'
      );


    renderArchive(
      archiveItems
    );

  }

  catch(error) {

    console.error(
      error
    );


    status.textContent =
      'ERRORE COLLEGAMENTO';


    document
      .getElementById(
        'archive'
      )
      .innerHTML =
      `
        <div class="empty">
          ${escapeHtml(error.message)}
        </div>
      `;

  }

}


/* =========================================================
   ORDINAMENTO
========================================================= */

function artistSortKey(artist) {

  let value =
    normalize(
      artist
    );


  value =
    value.replace(
      /^(the|a|an|il|lo|la|i|gli|le|un|uno|una)\s+/i,
      ''
    );


  const parts =
    value
      .split(/\s+/)
      .filter(Boolean);


  if (!parts.length) {
    return '';
  }


  return (
    parts[
      parts.length - 1
    ] +
    ' ' +
    value
  );

}


function sortItems(items) {

  return [
    ...items
  ]
  .sort(
    function(a,b) {

      const artistCompare =
        artistSortKey(
          a.autore
        )
        .localeCompare(
          artistSortKey(
            b.autore
          ),
          'it',
          {
            sensitivity:'base'
          }
        );


      if (
        artistCompare !== 0
      ) {

        return artistCompare;

      }


      return String(
        a.titolo || ''
      )
      .localeCompare(
        String(
          b.titolo || ''
        ),
        'it',
        {
          sensitivity:'base'
        }
      );

    }
  );

}


/* =========================================================
   RENDER ARCHIVIO
========================================================= */

function renderArchive(items) {

  const container =
    document.getElementById(
      'archive'
    );


  if (
    !items.length
  ) {

    container.innerHTML =
      `
        <div class="empty">
          Nessun disco trovato.
        </div>
      `;

    return;

  }


  container.innerHTML =
    items
      .map(
        function(item) {

          return recordHtml(
            item
          );

        }
      )
      .join('');


  items.forEach(
    function(item) {

      if (
        item.hasPhoto
      ) {

        loadCover(
          item.id
        );

      }

    }
  );

}


/* =========================================================
   RECORD
========================================================= */

function recordHtml(item) {

  const metadata = [];


  if (
    item.label
  ) {

    metadata.push(
      escapeHtml(
        item.label
      )
    );

  }


  if (
    item.annoPubblicazione
  ) {

    metadata.push(
      '<span class="year">℗ ' +
      escapeHtml(
        item.annoPubblicazione
      ) +
      '</span>'
    );

  }


  if (
    item.annoStampa
  ) {

    metadata.push(
      'R ' +
      escapeHtml(
        item.annoStampa
      )
    );

  }


  return `

    <article class="record">

      <div class="cover-wrap">

        <div
          id="placeholder-${item.id}"
          class="cover-placeholder"
        >
          ${
            item.hasPhoto
              ? 'CARICAMENTO...'
              : 'FOTO NON DISPONIBILE'
          }
        </div>

        <img
          id="cover-${item.id}"
          class="cover"
          style="display:none;"
          alt="${escapeHtml(item.autore)}"
        >

      </div>


      <div>

        <div class="artist">
          ${escapeHtml(item.autore)}
        </div>


        <div class="album">
          “${escapeHtml(item.titolo)}”
        </div>


        ${
          metadata.length
            ? `
              <div class="meta">
                (${metadata.join(', ')})
              </div>
            `
            : ''
        }


        ${
          item.formato
            ? `
              <div class="format">
                ${escapeHtml(item.formato)}
              </div>
            `
            : ''
        }


        ${
          item.genere
            ? `
              <div class="genre">
                ${escapeHtml(item.genere)}
              </div>
            `
            : ''
        }

      </div>

    </article>

  `;

}


/* =========================================================
   COPERTINE
========================================================= */

async function loadCover(id) {

  try {

    const response =
      await jsonpRequest(
        'cover',
        {
          id:id
        }
      );


    if (
      !response ||
      !response.success ||
      !response.data
    ) {

      return;

    }


    const image =
      document.getElementById(
        'cover-' +
        id
      );


    const placeholder =
      document.getElementById(
        'placeholder-' +
        id
      );


    if (!image) {
      return;
    }


    image.src =
      response.data;


    image.onload =
      function() {

        image.style.display =
          'block';


        if (
          placeholder
        ) {

          placeholder.style.display =
            'none';

        }

      };

  }

  catch(error) {

    console.error(
      'Foto ' +
      id,
      error
    );

  }

}


/* =========================================================
   RICERCA TESTUALE
========================================================= */

function runSearch() {

  const query =
    normalize(
      document
        .getElementById(
          'searchInput'
        )
        .value
    );


  if (!query) {

    renderArchive(
      archiveItems
    );

    return;

  }


  const results =
    archiveItems.filter(
      function(item) {

        return (
          normalize(
            item.autore
          ).includes(query)

          ||

          normalize(
            item.titolo
          ).includes(query)

          ||

          normalize(
            item.label
          ).includes(query)

          ||

          normalize(
            item.genere
          ).includes(query)

          ||

          normalize(
            item.annoPubblicazione
          ).includes(query)

          ||

          normalize(
            item.annoStampa
          ).includes(query)
        );

      }
    );


  renderArchive(
    results
  );

}


function clearSearch() {

  document
    .getElementById(
      'searchInput'
    )
    .value =
    '';


  renderArchive(
    archiveItems
  );

}


/* =========================================================
   RICERCA VOCALE - IOS SAFE
========================================================= */

let voiceRecognition = null;
let voiceSession = 0;
let voiceTimer = null;


function resetVoiceUI() {

  const button =
    document.getElementById('voiceButton');

  if (button) {

    button.disabled = false;

    button.classList.remove(
      'listening'
    );

    button.textContent =
      '🎤 RICERCA RAPIDA';
  }
}


function destroyVoiceRecognition() {

  if (voiceTimer) {

    clearTimeout(
      voiceTimer
    );

    voiceTimer = null;
  }


  if (voiceRecognition) {

    try {

      voiceRecognition.onresult = null;
      voiceRecognition.onerror = null;
      voiceRecognition.onend = null;
      voiceRecognition.onnomatch = null;
      voiceRecognition.onspeechend = null;

      voiceRecognition.abort();

    } catch(error) {

      console.log(
        'Voice abort:',
        error
      );
    }
  }


  voiceRecognition = null;

  resetVoiceUI();
}


function startVoiceSearch() {

  /*
    Uccidiamo qualunque sessione precedente.
  */

  destroyVoiceRecognition();


  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!Recognition) {

    setVoiceMessage(
      'Riconoscimento vocale non disponibile.',
      true
    );

    return;
  }


  voiceSession++;

  const thisSession =
    voiceSession;


  const recognition =
    new Recognition();


  voiceRecognition =
    recognition;


  recognition.lang =
    'it-IT';


  recognition.continuous =
    false;


  recognition.interimResults =
    false;


  recognition.maxAlternatives =
    1;


  const button =
    document.getElementById(
      'voiceButton'
    );


  if (button) {

    button.disabled = true;

    button.classList.add(
      'listening'
    );

    button.textContent =
      '🎤 PARLA...';
  }


  setVoiceMessage(
    'Sto ascoltando...',
    false
  );


  /*
    BLOCCO DI SICUREZZA IOS

    Se WebKit resta appeso e non genera
    nessun evento, dopo 6 secondi
    azzeriamo comunque tutto.
  */

  voiceTimer =
    setTimeout(
      function() {

        if (
          thisSession !== voiceSession
        ) {
          return;
        }


        destroyVoiceRecognition();


        setVoiceMessage(
          'Ascolto terminato. Premi di nuovo per una nuova ricerca.',
          false
        );

      },
      6000
    );


  recognition.onresult =
    function(event) {

      if (
        thisSession !== voiceSession
      ) {
        return;
      }


      let text = '';


      try {

        text =
          event
            .results[0][0]
            .transcript
            .trim();

      } catch(error) {

        console.error(
          error
        );
      }


      /*
        PRIMA resettiamo completamente
        il microfono.
      */

      destroyVoiceRecognition();


      if (!text) {

        setVoiceMessage(
          'Non ho capito. Riprova.',
          true
        );

        return;
      }


      setVoiceMessage(
        'Ho capito: “' +
        text +
        '”',
        false
      );


      /*
        Lasciamo a iOS il tempo
        di chiudere la sessione audio
        prima della ricerca.
      */

      setTimeout(
        function() {

          executeVoiceCommand(
            text
          );

        },
        300
      );

    };


  recognition.onerror =
    function(event) {

      if (
        thisSession !== voiceSession
      ) {
        return;
      }


      const code =
        event &&
        event.error
          ? event.error
          : 'errore';


      destroyVoiceRecognition();


      if (
        code === 'aborted'
      ) {
        return;
      }


      if (
        code === 'no-speech'
      ) {

        setVoiceMessage(
          'Non ho sentito nulla. Riprova.',
          true
        );

        return;
      }


      setVoiceMessage(
        'Errore riconoscimento vocale: ' +
        code,
        true
      );

    };


  recognition.onnomatch =
    function() {

      if (
        thisSession !== voiceSession
      ) {
        return;
      }


      destroyVoiceRecognition();


      setVoiceMessage(
        'Non ho riconosciuto la frase. Riprova.',
        true
      );

    };


  recognition.onspeechend =
    function() {

      /*
        NON facciamo stop().
        Su iOS può contribuire al blocco.

        Aspettiamo il risultato oppure
        il timeout di sicurezza.
      */

    };


  recognition.onend =
    function() {

      if (
        thisSession !== voiceSession
      ) {
        return;
      }


      /*
        Se onend arriva normalmente
        e non abbiamo già distrutto tutto,
        resettiamo l'interfaccia.
      */

      if (
        voiceRecognition === recognition
      ) {

        destroyVoiceRecognition();

      }

    };


  try {

    recognition.start();

  }

  catch(error) {

    destroyVoiceRecognition();


    setVoiceMessage(
      'Microfono non disponibile. Riprova.',
      true
    );

  }
}


/* =========================================================
   INTERPRETA COMANDO VOCALE
========================================================= */

function executeVoiceCommand(text) {

  let value =
    String(
      text || ''
    )
    .trim();


  value =
    value
      .replace(
        /^fammi vedere tutti\s+/i,
        ''
      )
      .replace(
        /^fammi vedere tutte\s+/i,
        ''
      )
      .replace(
        /^fammi vedere\s+/i,
        ''
      )
      .replace(
        /^mostrami\s+/i,
        ''
      )
      .replace(
        /^mostra\s+/i,
        ''
      )
      .replace(
        /^cercami\s+/i,
        ''
      )
      .replace(
        /^cerca\s+/i,
        ''
      )
      .replace(
        /^trova\s+/i,
        ''
      )
      .replace(
        /^trovami\s+/i,
        ''
      )
      .replace(
        /^voglio vedere\s+/i,
        ''
      )
      .replace(
        /^(i|gli|le)\s+/i,
        ''
      )
      .replace(
        /^(dischi|album|vinili|cd|cassette)\s+/i,
        ''
      )
      .replace(
        /^(di|dei|degli|delle|del|della)\s+/i,
        ''
      )
      .replace(
        /[?.!,;:]+$/g,
        ''
      )
      .replace(
        /\s+/g,
        ' '
      )
      .trim();


  if (!value) {

    value =
      String(
        text || ''
      ).trim();
  }


  const input =
    document.getElementById(
      'searchInput'
    );


  if (input) {

    input.value =
      value;
  }


  runSearch();
}


/* =========================================================
   MESSAGGIO VOCALE
========================================================= */

function setVoiceMessage(
  text,
  error
) {

  const element =
    document.getElementById(
      'voiceMessage'
    );


  if (!element) {
    return;
  }


  element.textContent =
    text || '';


  element.classList.toggle(
    'error',
    !!error
  );
}

/* =========================================================
   UTILITÀ
========================================================= */

function normalize(value) {

  return String(
    value || ''
  )
  .trim()
  .toLowerCase()
  .normalize('NFD')
  .replace(
    /[\u0300-\u036f]/g,
    ''
  );

}


function escapeHtml(value) {

  return String(
    value == null
      ? ''
      : value
  )
  .replace(
    /&/g,
    '&amp;'
  )
  .replace(
    /</g,
    '&lt;'
  )
  .replace(
    />/g,
    '&gt;'
  )
  .replace(
    /"/g,
    '&quot;'
  )
  .replace(
    /'/g,
    '&#039;'
  );

}
